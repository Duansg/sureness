# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '17' ]
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
        cache: maven

    - name: Build with Maven (JDK ${{ matrix.java }})
      run: |
        if [ "${{ matrix.java }}" = "8" ]; then
          # Skip JDK 17 modules when building with JDK 8
          mvn -B clean package -DskipTests -pl '!support/spring-boot3-starter-sureness' -am
        else
          # Build all modules with JDK 17
          mvn -B clean package -DskipTests
        fi
